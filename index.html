<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Mời Kỷ Yếu - Hiệu Ứng Thủy Mặc</title>
    <style>
        /* Reset and Base Styles */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f4eedd; /* Parchment fallback */
            overflow: hidden; /* Hide scrollbars for a clean full-screen experience */
            font-family: 'Times New Roman', serif;
        }

        /* The Main Background using the provided image */
        #invitation-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('GEM_PHOTO_AAD797B9-0AC9-4200-A34B-85687CF4BC15_L0_001_recent_photo_F2E1F67E-F360-48EE-BE66-431B97250C67.jpg');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            /* Tăng độ sâu cho viền (Vignette effect) */
            box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.2);
        }

        /* Canvas for Leaves and Ink Blooms */
        #effects-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: pointer; /* Báo hiệu có thể tương tác */
        }

        /* Mist / Fog CSS Animations at the bottom */
        .mist-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40vh;
            z-index: 5;
            pointer-events: none;
            overflow: hidden;
            opacity: 0.5; /* Giảm từ 0.85 xuống 0.5 để sương mờ hơn */
        }

        .mist-layer {
            position: absolute;
            bottom: -5vh;
            width: 200vw;
            height: 100%;
            filter: blur(35px);
            border-radius: 50%;
        }

        .mist-1 {
            left: -50vw;
            background: radial-gradient(ellipse at center, rgba(230, 225, 210, 0.8) 0%, rgba(255, 255, 255, 0) 70%);
            animation: drift 35s ease-in-out infinite alternate;
        }

        .mist-2 {
            left: -10vw;
            background: radial-gradient(ellipse at center, rgba(180, 180, 180, 0.4) 0%, rgba(244, 238, 221, 0) 60%);
            animation: drift-reverse 45s ease-in-out infinite alternate;
            height: 120%;
        }
        
        .mist-3 {
            left: -80vw;
            background: radial-gradient(ellipse at center, rgba(200, 200, 200, 0.3) 0%, rgba(255, 255, 255, 0) 65%);
            animation: drift 25s ease-in-out infinite alternate-reverse;
            height: 80%;
        }

        @keyframes drift {
            0% { transform: translateX(0) scale(1); }
            100% { transform: translateX(25vw) scale(1.1); }
        }

        @keyframes drift-reverse {
            0% { transform: translateX(0) scale(1.1); }
            100% { transform: translateX(-15vw) scale(1); }
        }
    </style>
</head>
<body>

    <!-- Main Invitation Image -->
    <div id="invitation-bg"></div>

    <!-- CSS Mist/Fog Effect -->
    <div class="mist-container">
        <div class="mist-layer mist-1"></div>
        <div class="mist-layer mist-2"></div>
        <div class="mist-layer mist-3"></div>
    </div>

    <!-- JS Canvas for Falling Leaves & Ink Blooms -->
    <canvas id="effects-canvas"></canvas>

    <script>
        const canvas = document.getElementById('effects-canvas');
        const ctx = canvas.getContext('2d');

        // Resize Canvas to fit Window
        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Configuration ---
        const config = {
            leafCount: 20,          
            inkBloomFreq: 0.01,     
            maxInkBlooms: 8,
            petalCount: 15          // Số lượng cánh hoa đỏ lưa thưa
        };

        // --- Classes ---

        // 1. Cánh hoa đỏ rơi ngang (Red Petals)
        class Petal {
            constructor() { this.reset(true); }
            reset(initial = false) {
                // Rơi từ bên phải hoặc phía trên
                this.x = initial ? Math.random() * width : width + 50;
                this.y = Math.random() * height - 100;
                this.size = Math.random() * 5 + 5;
                // Vận tốc bay ngang lác đác từ phải sang trái
                this.speedX = -(Math.random() * 2 + 1); 
                this.speedY = Math.random() * 1 + 0.3;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.05;
                this.flip = Math.random() * Math.PI;
                this.flipSpeed = Math.random() * 0.04 + 0.01;
                this.opacity = Math.random() * 0.3 + 0.15; // Giảm độ đậm của cánh hoa
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;
                this.flip += this.flipSpeed;
                
                // Trôi ra khỏi màn hình thì reset
                if (this.x < -50 || this.y > height + 50) {
                    this.reset();
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.scale(Math.abs(Math.sin(this.flip)), 1); // Hiệu ứng lật 3D
                
                ctx.beginPath();
                ctx.moveTo(0, 0);
                // Tạo hình dáng cánh hoa bằng đường cong
                ctx.bezierCurveTo(this.size * 1.5, -this.size, this.size * 2, this.size, 0, this.size * 1.2);
                ctx.bezierCurveTo(-this.size, this.size, -this.size * 0.5, -this.size * 0.5, 0, 0);
                
                // Màu hoa đỏ thẫm/nhạt hài hòa với nền thủy mặc
                ctx.fillStyle = `rgba(180, 40, 40, ${this.opacity})`;
                ctx.fill();
                ctx.restore();
            }
        }

        // 2. Lá trúc rơi 3D (Falling Bamboo Leaves)
        class Leaf {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : -50;
                this.size = Math.random() * 8 + 12;
                this.speedY = Math.random() * 1.2 + 0.8;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.03;
                this.sway = Math.random() * Math.PI * 2;
                this.flipSpeed = (Math.random() * 0.05) + 0.02; // Tốc độ lật
                this.flip = Math.random() * Math.PI;
                this.opacity = Math.random() * 0.25 + 0.1; // Giảm độ đậm của lá trúc
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.sway) * 0.4;
                this.sway += 0.015;
                this.rotation += this.rotationSpeed;
                this.flip += this.flipSpeed;

                if (this.y > height + 50 || this.x < -50 || this.x > width + 50) {
                    this.reset();
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                // Hiệu ứng lật 3D bằng cách scale chiều ngang theo hàm sin
                ctx.scale(Math.abs(Math.sin(this.flip)), 1); 
                
                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                ctx.quadraticCurveTo(this.size / 2.5, 0, 0, this.size);
                ctx.quadraticCurveTo(-this.size / 2.5, 0, 0, -this.size);
                
                ctx.fillStyle = `rgba(20, 20, 20, ${this.opacity})`;
                ctx.fill();
                ctx.restore();
            }
        }

        // 4. Mực loang (Ink Blooms)
        class InkBloom {
            constructor() { this.active = false; }
            spawn(x = null, y = null) {
                this.active = true;
                this.x = x !== null ? x : (Math.random() * (width - 100) + 50);
                this.y = y !== null ? y : (Math.random() * (height - 100) + 50);
                this.radius = 0;
                this.maxRadius = Math.random() * 60 + 40;
                this.opacity = Math.random() * 0.2 + 0.05; // Giảm độ đậm của mực loang
                this.growthRate = Math.random() * 0.3 + 0.15;
                this.fadeRate = 0.0015;
            }
            update() {
                if (!this.active) return;
                if (this.radius < this.maxRadius) this.radius += this.growthRate;
                if (this.radius > this.maxRadius * 0.6) this.opacity -= this.fadeRate;
                if (this.opacity <= 0) this.active = false;
            }
            draw(ctx) {
                if (!this.active) return;
                ctx.save();
                ctx.beginPath();
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0, 
                    this.x, this.y, this.radius
                );
                gradient.addColorStop(0, `rgba(20, 20, 20, ${this.opacity})`);
                gradient.addColorStop(0.3, `rgba(40, 40, 40, ${this.opacity * 0.7})`);
                gradient.addColorStop(1, `rgba(100, 100, 100, 0)`);
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
                ctx.restore();
            }
        }

        // --- Initialization ---
        const petals = Array.from({length: config.petalCount}, () => new Petal());
        const leaves = Array.from({length: config.leafCount}, () => new Leaf());
        const inkBlooms = Array.from({length: config.maxInkBlooms}, () => new InkBloom());

        // --- Tương tác Click để tạo Mực loang ---
        canvas.addEventListener('click', (e) => {
            const inactiveBloom = inkBlooms.find(b => !b.active);
            if (inactiveBloom) {
                inactiveBloom.spawn(e.clientX, e.clientY);
            }
        });

        // Hỗ trợ Touch cho điện thoại
        canvas.addEventListener('touchstart', (e) => {
            const inactiveBloom = inkBlooms.find(b => !b.active);
            if (inactiveBloom && e.touches.length > 0) {
                inactiveBloom.spawn(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, {passive: true});

        // --- Animation Loop ---
        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Tự động sinh mực loang ngẫu nhiên
            if (Math.random() < config.inkBloomFreq) {
                const inactiveBloom = inkBlooms.find(b => !b.active);
                if (inactiveBloom) inactiveBloom.spawn();
            }

            inkBlooms.forEach(b => { b.update(); b.draw(ctx); });
            petals.forEach(p => { p.update(); p.draw(ctx); });
            leaves.forEach(l => { l.update(); l.draw(ctx); });

            requestAnimationFrame(animate);
        }

        // Start Animation
        window.onload = function() {
            animate();
        };

    </script>
</body>
</html>
